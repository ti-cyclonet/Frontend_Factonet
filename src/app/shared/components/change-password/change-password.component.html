<div *ngIf="forced" class="forced-password-banner">
  <svg width="16" height="16"><use xlink:href="./assets/icons/bootstrap-icons.svg#exclamation-triangle-fill" /></svg>
  Debes cambiar tu contraseña temporal antes de continuar.
</div>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label for="oldPassword" class="form-label">Old password</label>
    <div class="password-input-group">
      <svg width="14" height="14" class="pwd-icon"><use xlink:href="./assets/icons/bootstrap-icons.svg#key-fill" /></svg>
      <input
        [type]="showOldPassword ? 'text' : 'password'"
        id="oldPassword"
        formControlName="oldPassword"
        class="form-control"
        required
      />
      <button type="button" class="pwd-toggle" (click)="togglePasswordVisibility('old')" tabindex="-1">
        <svg width="16" height="16"><use [attr.xlink:href]="'./assets/icons/bootstrap-icons.svg#' + (showOldPassword ? 'eye-slash' : 'eye')" /></svg>
      </button>
    </div>
  </div>

  <div class="mb-3">
    <label for="newPassword" class="form-label">New password</label>
    <div class="password-input-group">
      <svg width="14" height="14" class="pwd-icon"><use xlink:href="./assets/icons/bootstrap-icons.svg#shield-lock" /></svg>
      <input
        [type]="showNewPassword ? 'text' : 'password'"
        id="newPassword"
        formControlName="newPassword"
        class="form-control"
        required
      />
      <button type="button" class="pwd-toggle" (click)="togglePasswordVisibility('new')" tabindex="-1">
        <svg width="16" height="16"><use [attr.xlink:href]="'./assets/icons/bootstrap-icons.svg#' + (showNewPassword ? 'eye-slash' : 'eye')" /></svg>
      </button>
    </div>
    <small class="form-text text-muted">Mínimo 6 caracteres.</small>
  </div>

  <div class="mb-3">
    <label for="repeatPassword" class="form-label">Repeat password</label>
    <div class="password-input-group">
      <svg width="14" height="14" class="pwd-icon"><use xlink:href="./assets/icons/bootstrap-icons.svg#shield-lock" /></svg>
      <input
        [type]="showRepeatPassword ? 'text' : 'password'"
        id="repeatPassword"
        formControlName="repeatPassword"
        class="form-control"
        required
      />
      <button type="button" class="pwd-toggle" (click)="togglePasswordVisibility('repeat')" tabindex="-1">
        <svg width="16" height="16"><use [attr.xlink:href]="'./assets/icons/bootstrap-icons.svg#' + (showRepeatPassword ? 'eye-slash' : 'eye')" /></svg>
      </button>
    </div>
    <div *ngIf="passwordsMismatch" class="text-danger pwd-feedback">
      <svg width="12" height="12"><use xlink:href="./assets/icons/bootstrap-icons.svg#exclamation-triangle-fill" /></svg>
      The passwords don't match.
    </div>
    <div *ngIf="passwordsMatch" class="text-success pwd-feedback">
      <svg width="12" height="12"><use xlink:href="./assets/icons/bootstrap-icons.svg#check-circle-fill" /></svg>
      Passwords match.
    </div>
  </div>

  <div class="modal-footer px-0 pb-0">
    <button *ngIf="!forced" type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving || passwordsMismatch">
      <span *ngIf="saving" class="spinner-border spinner-border-sm me-1"></span>
      Update
    </button>
  </div>
</form>
